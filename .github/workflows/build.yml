name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyni olish
        uses: actions/checkout@v4

      - name: project.zip ni ochish
        run: |
          test -f project.zip || { echo "project.zip topilmadi (repozitoriy ildizida bo'lishi kerak)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -o project.zip -d "$RUNNER_TEMP/src"
          SETTINGS=$(find "$RUNNER_TEMP/src" -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          test -n "$SETTINGS" || { echo "settings.gradle(.kts) zip ichida topilmadi"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK yig'ish (debug)
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: APK ni tayyorlash
        run: |
          APK=$(find "$PROJECT_DIR" -path "*outputs/apk/debug/*.apk" | head -n 1)
          test -n "$APK" || { echo "APK topilmadi"; exit 1; }
          mkdir -p dist
          cp "$APK" dist/Taklifnoma.apk
          ls -la dist

      - name: Artifact sifatida yuklash
        uses: actions/upload-artifact@v4
        with:
          name: Taklifnoma-apk
          path: dist/Taklifnoma.apk

      - name: Releases bo'limiga qo'yish (telefondan yuklab olish uchun)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Taklifnoma APK #${{ github.run_number }}
          files: dist/Taklifnoma.apk
